<!DOCTYPE html>
<html>
<head>
    <title>Media Converter</title>
</head>
<body>
    <div id="mediaConverterPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-select,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">
                <div id="mediaConverterError" class="verticalSection" style="display:none;color:#ff8a80;"></div>

                <div class="verticalSection">
                    <h1>Media Converter</h1>
                    <div class="inputContainer">
                        <input is="emby-input" type="text" id="searchTerm" label="Search library (movie or show name)" />
                    </div>
                    <button is="emby-button" type="button" class="raised button-submit" id="searchButton">
                        <span>Search</span>
                    </button>
                </div>

                <div class="verticalSection">
                    <h2>Results</h2>
                    <div id="libraryResults"></div>
                </div>

                <div class="verticalSection" id="episodesSection" style="display:none;">
                    <h2>Episodes <span id="episodesSeriesName"></span></h2>
                    <button is="emby-button" type="button" class="raised" id="backToResultsButton">
                        <span>Back to results</span>
                    </button>
                    <div id="episodeResults"></div>
                </div>

                <div class="verticalSection">
                    <h2>Jobs</h2>
                    <div id="jobResults"></div>
                </div>
            </div>
        </div>

        <div id="convertDialog" style="display:none;">
            <h3 id="convertDialogTitle">Convert</h3>
            <div class="inputContainer">
                <label class="inputLabel" for="containerSelect">Container</label>
                <select is="emby-select" id="containerSelect">
                    <option value="mkv">mkv</option>
                    <option value="mp4">mp4</option>
                </select>
            </div>
            <div class="inputContainer">
                <label class="inputLabel" for="codecSelect">Codec</label>
                <select is="emby-select" id="codecSelect">
                    <option value="hevc">HEVC (H.265)</option>
                    <option value="h264">H.264</option>
                    <option value="av1">AV1</option>
                </select>
            </div>
            <div class="inputContainer">
                <label class="inputLabel" for="rateControlSelect">Rate control</label>
                <select is="emby-select" id="rateControlSelect">
                    <option value="Quality">Quality-based (CRF/CQ)</option>
                    <option value="Bitrate">Target average bitrate</option>
                    <option value="HalfSourceBitrate">Half of each source's current bitrate (HEVC/AV1)</option>
                </select>
            </div>
            <div class="inputContainer">
                <input is="emby-input" type="number" id="qualityInput" label="Quality" value="23" />
            </div>
            <div class="inputContainer" id="videoBitrateContainer" style="display:none;">
                <input is="emby-input" type="number" id="videoBitrateInput" label="Target video bitrate, kbps" />
            </div>
            <div class="inputContainer">
                <span id="predictedSizeText" style="opacity:0.85;"></span>
            </div>
            <div class="inputContainer">
                <input is="emby-input" type="number" id="maxVideoBitrateInput" label="Max video bitrate cap, kbps (optional, either mode)" />
            </div>
            <div class="inputContainer">
                <label class="inputLabel" for="presetSelect">Encoder preset (speed vs. compression)</label>
                <select is="emby-select" id="presetSelect">
                    <option value="">Encoder default</option>
                    <option value="ultrafast">Ultrafast</option>
                    <option value="veryfast">Very fast</option>
                    <option value="fast">Fast</option>
                    <option value="medium">Medium</option>
                    <option value="slow">Slow</option>
                    <option value="veryslow">Very slow</option>
                </select>
            </div>
            <div class="inputContainer">
                <label class="inputLabel" for="resolutionSelect">Resolution</label>
                <select is="emby-select" id="resolutionSelect">
                    <option value="">Keep source resolution</option>
                    <option value="2160">2160p (4K)</option>
                    <option value="1080">1080p</option>
                    <option value="720">720p</option>
                    <option value="480">480p</option>
                </select>
            </div>
            <div class="inputContainer">
                <label class="inputLabel" for="audioCodecSelect">Audio</label>
                <select is="emby-select" id="audioCodecSelect">
                    <option value="copy">Copy (no re-encode)</option>
                    <option value="aac">AAC</option>
                    <option value="ac3">AC3 (Dolby Digital)</option>
                    <option value="eac3">E-AC3 (Dolby Digital+)</option>
                    <option value="libopus">Opus</option>
                    <option value="flac">FLAC (lossless)</option>
                </select>
            </div>
            <div class="inputContainer">
                <input is="emby-input" type="number" id="audioBitrateInput" label="Audio bitrate, kbps (blank = default; ignored when copying)" />
            </div>
            <div class="inputContainer">
                <label class="inputLabel" for="subtitleModeSelect">Subtitles</label>
                <select is="emby-select" id="subtitleModeSelect">
                    <option value="Copy">Copy</option>
                    <option value="None">Drop subtitles</option>
                </select>
            </div>
            <div class="inputContainer">
                <label class="inputLabel" for="modeSelect">Mode</label>
                <select is="emby-select" id="modeSelect">
                    <option value="Variant">Create new variant</option>
                    <option value="Replace">Replace original</option>
                </select>
            </div>
            <div class="inputContainer">
                <input is="emby-input" type="text" id="ffmpegOverrideInput" label="Advanced: raw ffmpeg args (optional, overrides all encoding options above)" />
            </div>
            <button is="emby-button" type="button" class="raised button-submit" id="startConversionButton">
                <span>Convert</span>
            </button>
        </div>

        <script type="text/javascript" src="configurationpage?name=mediaconverterjs"></script>
    </div>
</body>
</html>
