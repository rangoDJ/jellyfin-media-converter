<!DOCTYPE html>
<html>
<head>
    <title>Media Converter</title>
</head>
<body>
    <div id="mediaConverterPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-select,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">
                <div id="mediaConverterError" class="verticalSection" style="display:none;color:#ff8a80;"></div>

                <div class="verticalSection">
                    <h1>Media Converter</h1>
                    <div class="inputContainer">
                        <input is="emby-input" type="text" id="searchTerm" label="Search library (movie or show name)" />
                    </div>
                    <button is="emby-button" type="button" class="raised button-submit" id="searchButton">
                        <span>Search</span>
                    </button>
                </div>

                <div class="verticalSection">
                    <h2>Results</h2>
                    <div id="libraryResults"></div>
                </div>

                <div class="verticalSection" id="episodesSection" style="display:none;">
                    <h2>Episodes <span id="episodesSeriesName"></span></h2>
                    <button is="emby-button" type="button" class="raised" id="backToResultsButton">
                        <span>Back to results</span>
                    </button>
                    <div id="episodeResults"></div>
                </div>

                <div class="verticalSection">
                    <h2>Jobs</h2>
                    <div id="jobResults"></div>
                </div>
            </div>
        </div>

        <div id="convertDialog" style="display:none;">
            <div class="inputContainer">
                <label class="inputLabel" for="containerSelect">Container</label>
                <select is="emby-select" id="containerSelect">
                    <option value="mkv">mkv</option>
                    <option value="mp4">mp4</option>
                </select>
            </div>
            <div class="inputContainer">
                <label class="inputLabel" for="codecSelect">Codec</label>
                <select is="emby-select" id="codecSelect">
                    <option value="hevc">HEVC (H.265)</option>
                    <option value="h264">H.264</option>
                    <option value="av1">AV1</option>
                </select>
            </div>
            <div class="inputContainer">
                <input is="emby-input" type="number" id="qualityInput" label="Quality" value="23" />
            </div>
            <div class="inputContainer">
                <label class="inputLabel" for="modeSelect">Mode</label>
                <select is="emby-select" id="modeSelect">
                    <option value="Variant">Create new variant</option>
                    <option value="Replace">Replace original</option>
                </select>
            </div>
            <div class="inputContainer">
                <input is="emby-input" type="text" id="ffmpegOverrideInput" label="Advanced: raw ffmpeg args (optional)" />
            </div>
            <button is="emby-button" type="button" class="raised button-submit" id="startConversionButton">
                <span>Convert</span>
            </button>
        </div>

        <script type="text/javascript" src="configurationpage?name=mediaconverterjs"></script>
    </div>
</body>
</html>
