name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.MediaConverter.sln

      - name: Build
        run: dotnet build Jellyfin.Plugin.MediaConverter.sln --configuration Release --no-restore /property:GenerateFullPaths=true /consoleloggerparameters:NoSummary

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.MediaConverter
          path: Jellyfin.Plugin.MediaConverter/bin/Release/net10.0/Jellyfin.Plugin.MediaConverter.dll
