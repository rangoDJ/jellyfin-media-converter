name: Publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Determine version and package name
        id: package
        run: |
          set -euo pipefail
          build_version=$(python3 -c "import yaml; print(yaml.safe_load(open('build.yaml'))['version'])")
          tag_version=${GITHUB_REF_NAME#v}

          # build.yaml uses 4-part versions (e.g. 1.0.1.0); tags use 3-part (e.g. v1.0.1).
          if [ "${build_version%.0}" != "$tag_version" ] && [ "$build_version" != "$tag_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match build.yaml's version (${build_version}). Bump build.yaml before tagging a release."
            exit 1
          fi

          echo "version=${build_version}" >> "$GITHUB_OUTPUT"
          echo "zip_name=jellyfin-media-converter_${build_version}.zip" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.MediaConverter.sln

      - name: Build
        run: |
          dotnet build Jellyfin.Plugin.MediaConverter.sln --configuration Release --no-restore \
            -p:Version=${{ steps.package.outputs.version }} \
            -p:AssemblyVersion=${{ steps.package.outputs.version }} \
            -p:FileVersion=${{ steps.package.outputs.version }}

      - name: Package plugin zip
        run: |
          set -euo pipefail
          mkdir -p artifacts
          zip -j "artifacts/${{ steps.package.outputs.zip_name }}" \
            "Jellyfin.Plugin.MediaConverter/bin/Release/net10.0/Jellyfin.Plugin.MediaConverter.dll"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.package.outputs.version }}"
          tag_name: ${{ github.ref_name }}
          files: artifacts/${{ steps.package.outputs.zip_name }}

      - name: Update repository manifest
        run: |
          python3 scripts/update_manifest.py \
            manifest.json \
            build.yaml \
            "artifacts/${{ steps.package.outputs.zip_name }}" \
            "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.package.outputs.zip_name }}"

      - name: Commit updated manifest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --cached --quiet; then
            echo "No manifest changes to commit"
          else
            git commit -m "Add v${{ steps.package.outputs.version }} to repository manifest"
            git push origin HEAD:master
          fi
