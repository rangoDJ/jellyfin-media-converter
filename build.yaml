overview: "Convert library media files from the dashboard, using this server's configured ffmpeg hardware transcoder or CPU."
description: >
  Browse your Jellyfin library, pick a video, and convert it to a different
  container/codec using the server's own bundled ffmpeg - automatically using
  whichever hardware transcoder (Intel QSV, Nvidia NVENC, AMD AMF) is already
  configured in Jellyfin's playback settings, or CPU if none is enabled -
  either replacing the original file in place or creating a new variant
  alongside it, with a live progress bar.
