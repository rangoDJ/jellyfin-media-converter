targetAbi: "12.0.0.0"
framework: "net10.0"
overview: "Convert library media files from the dashboard, using this server's configured ffmpeg hardware transcoder or CPU."
description: >
  Browse your Jellyfin library, pick a video, and convert it to a different
  container/codec using the server's own bundled ffmpeg - automatically using
  whichever hardware transcoder (Intel QSV, Nvidia NVENC, AMD AMF) is already
  configured in Jellyfin's playback settings, or CPU if none is enabled -
  either replacing the original file in place or creating a new variant
  alongside it, with a live progress bar.
category: "General"
owner: "rangoDJ"
artifacts:
- "Jellyfin.Plugin.MediaConverter.dll"
changelog: >
  1.0.12: Fixed the variant comparison panel silently collapsing a
  few seconds after opening it - the jobs list was fully rebuilding
  its DOM on every 3-second poll even when nothing had changed,
  wiping out the comparison results. Jobs are now only re-rendered
  when their status/progress/variant decision actually changes. Also
  added a "Play side by side" option to the variant comparison view,
  streaming the original and new variant files into two video players
  with a shared restart/pause control, so you can visually compare
  playback before deciding which one to keep.
  1.0.11: Clicking an episode/movie's name now shows its full ffprobe
  codec/bitrate info (previously only a compact summary with no
  bitrate). The convert dialog can now target an average video
  bitrate instead of only a fixed quality value, with an optional max
  bitrate cap, and shows a predicted output file size when doing so.
  A "Convert at ~half bitrate" shortcut appears for HEVC/AV1 when the
  source's bitrate is known. Running jobs now show an actual progress
  bar instead of only a percentage number.
  1.0.10: The series episode browser now lists seasons first (with
  episode counts) instead of dumping every episode from every season
  into one long scrolling list. Click a season to see just its
  episodes, with a "Back to seasons" step before returning to the
  search results - much more usable for shows with many episodes.
  1.0.9: The convert dialog now exposes audio codec/bitrate, subtitle
  handling (copy/drop), output resolution scaling, and encoder
  preset/speed, instead of always copying audio/subtitles and only
  letting you choose container, codec, and quality. You can also
  convert an entire season or series in one action instead of one
  item at a time. Each movie/episode row now shows its codec,
  resolution, audio, and file size, read live via ffprobe rather than
  Jellyfin's own library metadata. "Create new variant" jobs let you
  compare the original and new file's ffprobe stats side by side once
  finished, then choose which one to keep/delete. Conversions are now
  rejected up front with a clear message if the destination folder
  isn't writable by the server process, instead of failing partway
  through the job.
  1.0.8: Fixed conversion progress staying frozen at 0% for the whole
  job. Progress calculation was silently skipped whenever the library
  item's RunTimeTicks metadata was missing (common for freshly-added
  or partially-scanned episodes) - now falls back to probing the
  file's actual duration via ffprobe when that metadata isn't present.
  1.0.7: Actually fixed the dashboard page's script never executing.
  Root-caused against a local Jellyfin 12.0.0 instance by reading the
  web client's own bundle: it extracts only div[data-role="page"] from
  the fetched HTML (via innerHTML, discarding everything outside that
  div) and only re-executes <script> tags found inside it (via jQuery)
  when present. Our script was a sibling AFTER that div, so it was
  silently dropped before ever reaching the DOM. Moving it to be the
  last child *inside* #mediaConverterPage fixes it - verified live:
  Search, Convert, the episode picker, and Jobs polling all work now.
  1.0.6: Confirmed Jellyfin's config-page loader strips <script> tags
  entirely (inline or external) on some web client versions, so the
  dashboard page's JS may never run regardless of how it's referenced.
  Adds itemdetail.js, a standalone script for use with a global script
  injector plugin (e.g. JavaScript Injector), which adds a floating
  Convert button directly on movie/episode detail pages.
  1.0.5: The dashboard's JavaScript is now served as its own embedded
  page and loaded via a <script src> reference, instead of being
  inlined directly in the config page's HTML - inline scripts weren't
  reliably executing on some Jellyfin web client versions (12.0-rc5),
  which was the actual root cause behind the button clicks silently
  doing nothing even after the 1.0.4 fix.
  1.0.4: Fixed Search/Convert/Cancel going dead again after navigating
  back to the Media Converter page within the same browser session -
  a one-time init guard was skipping listener setup on freshly
  inserted DOM elements after the first page visit.
  1.0.3: Searching now matches series names too, showing an episode
  picker (ordered by season/episode) instead of requiring the exact
  episode title. The dashboard also surfaces API errors visibly
  instead of failing silently.
  1.0.2: Fixed the plugin always reporting itself as version 0.0.0.0,
  which made Jellyfin's plugin details page fail with "An error
  occurred while getting the plugin details from the repository."
  1.0.1: Fixed the dashboard page's Search/Convert/Cancel buttons never
  responding to clicks - a pageshow event guard was checking the wrong
  DOM node and always bailing out before wiring up any listeners.
  1.0.0: Initial release: dashboard library browser, convert dialog with
  curated presets plus an advanced raw ffmpeg-args override,
  replace/variant modes, and live job progress.
